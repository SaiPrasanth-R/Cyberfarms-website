<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyberfarms — Admin</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="siteData.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1A2E1F;
      background: linear-gradient(180deg, #E8F5F2 0%, #F4F1E8 60%, #EFEAD9 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    a { color: #B8410E; }

    /* ===== Top bar ===== */
    .admin-topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #F4EFE4;
      border-bottom: 1px solid rgba(26, 46, 31, 0.15);
      padding: 0.9rem clamp(1.25rem, 4vw, 3rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: #1A2E1F;
    }

    .admin-brand-mark {
      width: 0.6rem;
      height: 0.6rem;
      background: #B8410E;
      border-radius: 50%;
    }

    .admin-brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4A6741;
      font-family: system-ui, sans-serif;
      font-weight: 600;
    }

    .admin-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      font-family: inherit;
      border: 1px solid;
      background: none;
    }

    .btn-outline { color: #1A2E1F; border-color: #1A2E1F; }
    .btn-outline:hover { background: #1A2E1F; color: #F4EFE4; }

    .btn-primary { background: #B8410E; color: #FFFFFF; border-color: #B8410E; }
    .btn-primary:hover { background: #1A2E1F; border-color: #1A2E1F; }

    .btn-danger { color: #8C2A0C; border-color: #8C2A0C; }
    .btn-danger:hover { background: #8C2A0C; color: #FFFFFF; }

    .btn-small { padding: 0.4rem 0.7rem; font-size: 0.68rem; }

    /* ===== Layout ===== */
    .admin-layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem clamp(1.25rem, 4vw, 3rem) 4rem;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 800px) {
      .admin-layout { grid-template-columns: 1fr; }
    }

    .admin-tabs {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      position: sticky;
      top: 90px;
    }

    @media (max-width: 800px) {
      .admin-tabs {
        flex-direction: row;
        flex-wrap: wrap;
        position: static;
      }
    }

    .admin-tab {
      text-align: left;
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0.65rem 0.9rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2C4233;
      cursor: pointer;
    }

    .admin-tab:hover { background: rgba(184, 65, 14, 0.08); }

    .admin-tab.active {
      background: #FFFFFF;
      border-color: rgba(26, 46, 31, 0.15);
      color: #B8410E;
      box-shadow: 0 2px 8px rgba(26, 46, 31, 0.06);
    }

    .admin-panel {
      background: #FFFFFF;
      border: 1px solid rgba(26, 46, 31, 0.12);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(26, 46, 31, 0.04);
      padding: 1.75rem clamp(1.25rem, 3vw, 2.25rem);
    }

    .admin-panel h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.6rem;
      margin: 0 0 0.35rem;
      color: #1A2E1F;
    }

    .admin-panel > p.hint {
      font-size: 0.85rem;
      color: #4A6741;
      margin: 0 0 1.5rem;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #2C4233;
      margin: 1rem 0 0.35rem;
    }

    label:first-of-type { margin-top: 0; }

    input[type="text"],
    input[type="url"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 0.9rem;
      color: #1A2E1F;
      padding: 0.6rem 0.75rem;
      border: 1px solid rgba(26, 46, 31, 0.2);
      border-radius: 5px;
      background: #FBFAF6;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #B8410E;
      background: #FFFFFF;
    }

    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

    /* ===== Category / product cards ===== */
    .cat-block {
      border: 1px solid rgba(26, 46, 31, 0.15);
      border-radius: 8px;
      padding: 1.25rem 1.25rem 1.5rem;
      margin: 0 0 1.75rem;
      background: #FBFAF6;
    }

    .cat-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.25rem;
    }

    .cat-id-tag {
      font-size: 0.68rem;
      color: #4A6741;
      font-family: ui-monospace, monospace;
    }

    .product-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 1.25rem;
      border: 1px solid rgba(26, 46, 31, 0.12);
      border-radius: 6px;
      padding: 1rem 1rem 1.25rem;
      margin-top: 1rem;
      background: #FFFFFF;
    }

    @media (max-width: 650px) {
      .product-row { grid-template-columns: 1fr; }
    }

    .product-row-header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }

    .product-row-header span {
      font-size: 0.75rem;
      font-weight: 700;
      color: #B8410E;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .full-width { grid-column: 1 / -1; }

    .add-row-btn {
      margin-top: 1.1rem;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #1A2E1F;
      color: #F4EFE4;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      font-size: 0.85rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      z-index: 100;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">

    function makeId() {
      return Math.random().toString(36).slice(2, 9);
    }

    function slugify(text) {
      return (text || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "") || "category-" + makeId();
    }

    function initialsFrom(name) {
      const words = (name || "").trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return "?";
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function emptyProduct() {
      return { name: "New Product", initials: "NP", description: "", docHref: "#blogs", downloadHref: "#" };
    }

    function TextField({ label, value, onChange, placeholder }) {
      return (
        <React.Fragment>
          <label>{label}</label>
          <input type="text" value={value} placeholder={placeholder}
                 onChange={(e) => onChange(e.target.value)} />
        </React.Fragment>
      );
    }

    function UrlField({ label, value, onChange, placeholder }) {
      return (
        <React.Fragment>
          <label>{label}</label>
          <input type="url" value={value} placeholder={placeholder}
                 onChange={(e) => onChange(e.target.value)} />
        </React.Fragment>
      );
    }

    function TextAreaField({ label, value, onChange, hint }) {
      return (
        <React.Fragment>
          <label>{label}</label>
          <textarea value={value} onChange={(e) => onChange(e.target.value)} />
          {hint && <p className="hint" style={{ margin: "0.35rem 0 0" }}>{hint}</p>}
        </React.Fragment>
      );
    }

    function HomePanel({ data, update }) {
      return (
        <div className="admin-panel">
          <h1>Home</h1>
          <p className="hint">Edits here update the hero section on the live site.</p>
          <TextField label="Heading" value={data.home.heading}
                     onChange={(v) => update((d) => { d.home.heading = v; })} />
          <TextAreaField label="Body text" value={data.home.body}
                     onChange={(v) => update((d) => { d.home.body = v; })} />
        </div>
      );
    }

    function AboutPanel({ data, update }) {
      return (
        <div className="admin-panel">
          <h1>About Us</h1>
          <TextField label="Heading" value={data.about.heading}
                     onChange={(v) => update((d) => { d.about.heading = v; })} />
          <TextAreaField label="Body text" value={data.about.body}
                     onChange={(v) => update((d) => { d.about.body = v; })} />
        </div>
      );
    }

    function ProductEditor({ product, onChange, onDelete }) {
      return (
        <div className="product-row">
          <div className="product-row-header">
            <span>Product</span>
            <button type="button" className="btn btn-danger btn-small" onClick={onDelete}>Remove</button>
          </div>

          <div>
            <TextField label="Name" value={product.name}
                       onChange={(v) => onChange({ ...product, name: v })} />
          </div>
          <div>
            <TextField label="Initials (logo)" value={product.initials}
                       onChange={(v) => onChange({ ...product, initials: v.toUpperCase().slice(0, 3) })} />
          </div>

          <div className="full-width">
            <TextAreaField label="Description" value={product.description}
                       onChange={(v) => onChange({ ...product, description: v })} />
          </div>

          <div>
            <UrlField label="Documentation link" value={product.docHref}
                       onChange={(v) => onChange({ ...product, docHref: v })}
                       placeholder="#blogs or https://..." />
          </div>
          <div>
            <UrlField label="Download link" value={product.downloadHref}
                       onChange={(v) => onChange({ ...product, downloadHref: v })}
                       placeholder="https://..." />
          </div>
        </div>
      );
    }

    function CategoryEditor({ category, update, onDeleteCategory }) {
      const setField = (field, value) => {
        update((d) => {
          const cat = d.categories.find((c) => c.id === category.id);
          cat[field] = value;
        });
      };

      const addProduct = () => {
        update((d) => {
          const cat = d.categories.find((c) => c.id === category.id);
          cat.products.push(emptyProduct());
        });
      };

      const updateProduct = (index, next) => {
        update((d) => {
          const cat = d.categories.find((c) => c.id === category.id);
          cat.products[index] = next;
        });
      };

      const deleteProduct = (index) => {
        update((d) => {
          const cat = d.categories.find((c) => c.id === category.id);
          cat.products.splice(index, 1);
        });
      };

      return (
        <div className="cat-block">
          <div className="cat-block-header">
            <TextField label="" value={category.name}
                       onChange={(v) => setField("name", v)} />
            <button type="button" className="btn btn-danger btn-small" onClick={onDeleteCategory}>
              Delete Category
            </button>
          </div>
          <span className="cat-id-tag">#{category.id}</span>

          <label>Category description</label>
          <textarea value={category.description}
                    onChange={(e) => setField("description", e.target.value)} />

          {category.products.map((p, i) => (
            <ProductEditor key={i} product={p}
                            onChange={(next) => updateProduct(i, next)}
                            onDelete={() => deleteProduct(i)} />
          ))}

          <button type="button" className="btn btn-outline btn-small add-row-btn" onClick={addProduct}>
            + Add Product
          </button>
        </div>
      );
    }

    function ProductsPanel({ data, update }) {
      const addCategory = () => {
        const name = "New Category";
        update((d) => {
          d.categories.push({
            id: slugify(name) + "-" + makeId(),
            name,
            description: "",
            products: [],
          });
        });
      };

      const deleteCategory = (id) => {
        if (!window.confirm("Delete this category and all its products?")) return;
        update((d) => {
          d.categories = d.categories.filter((c) => c.id !== id);
        });
      };

      return (
        <div className="admin-panel">
          <h1>Services / Products</h1>
          <p className="hint">
            Add or remove aggregators, platforms, and any other product category. Each category's
            products appear on the live site under Services/Products.
          </p>

          {data.categories.map((cat) => (
            <CategoryEditor key={cat.id} category={cat} update={update}
                             onDeleteCategory={() => deleteCategory(cat.id)} />
          ))}

          <button type="button" className="btn btn-primary" onClick={addCategory}>
            + Add Category
          </button>
        </div>
      );
    }

    const TABS = [
      { key: "home", label: "Home" },
      { key: "about", label: "About Us" },
      { key: "products", label: "Services / Products" },
    ];

    function App() {
      const [data, setData] = React.useState(() => window.CyberfarmsData.load());
      const [activeTab, setActiveTab] = React.useState("home");
      const [toast, setToast] = React.useState(null);
      const fileInputRef = React.useRef(null);

      React.useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2200);
        return () => clearTimeout(t);
      }, [toast]);

      // Immutable-ish update helper: pass a function that mutates a deep clone.
      const update = (mutator) => {
        setData((prev) => {
          const next = JSON.parse(JSON.stringify(prev));
          mutator(next);
          return next;
        });
      };

      const handleSave = () => {
        window.CyberfarmsData.save(data);
        setToast("Saved. Refresh the live site to see changes.");
      };

      const handleReset = () => {
        if (!window.confirm("Discard all edits and restore the original default content?")) return;
        window.CyberfarmsData.reset();
        const fresh = window.CyberfarmsData.load();
        setData(fresh);
        setToast("Reset to defaults.");
      };

      const handleExport = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "cyberfarms-site-data.json";
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportClick = () => fileInputRef.current && fileInputRef.current.click();

      const handleImportFile = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            setData(parsed);
            setToast("Imported. Click Save to apply.");
          } catch (err) {
            window.alert("That file isn't valid JSON site data.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      return (
        <div>
          <div className="admin-topbar">
            <div className="admin-brand">
              <span className="admin-brand-mark"></span>
              Cyberfarms
              <span className="admin-brand-sub" style={{ marginLeft: "0.5rem" }}>Admin</span>
            </div>
            <div className="admin-actions">
              <a href="index.html" target="_blank" rel="noopener" className="btn btn-outline">
                View Live Site
              </a>
              <button type="button" className="btn btn-outline" onClick={handleExport}>Export JSON</button>
              <button type="button" className="btn btn-outline" onClick={handleImportClick}>Import JSON</button>
              <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }}
                     onChange={handleImportFile} />
              <button type="button" className="btn btn-danger" onClick={handleReset}>Reset Defaults</button>
              <button type="button" className="btn btn-primary" onClick={handleSave}>Save Changes</button>
            </div>
          </div>

          <div className="admin-layout">
            <div className="admin-tabs">
              {TABS.map((t) => (
                <button key={t.key} type="button"
                        className={"admin-tab" + (activeTab === t.key ? " active" : "")}
                        onClick={() => setActiveTab(t.key)}>
                  {t.label}
                </button>
              ))}
            </div>

            {activeTab === "home" && <HomePanel data={data} update={update} />}
            {activeTab === "about" && <AboutPanel data={data} update={update} />}
            {activeTab === "products" && <ProductsPanel data={data} update={update} />}
          </div>

          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

  </script>

</body>
</html>
