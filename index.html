  <!--
    React will mount the entire app inside this <div>.
    The id "root" is the convention; you can name it anything.
  -->
  <div id="root"></div>

  <!--
    type="text/babel" is the magic bit — it tells Babel:
    "don't run this as plain JS, transpile the JSX first, THEN run it."

    Without type="text/babel", the browser would see <h1>... inside JS
    and throw a syntax error.
  -->
  <script type="text/babel">


    const productSubMenu = [
  { label: "Aggregators",              href: "#aggregators" },
  { label: "Platforms",                href: "#platforms" },
  { label: "Supply Chain & Logistics", href: "#supply-chain" },
  { label: "Workflow Engines",         href: "#workflow-engines" },
  { label: "Mental Health Training",   href: "#mental-health" },
];

const navItems = [
  { label: "Home",              href: "#home" },
  { label: "About Us",          href: "#about" },
  { label: "Services/Products", href: "#services", submenu: productSubMenu },
  { label: "Blogs",             href: "#blogs" },
  { label: "FAQ",               href: "#faq" },
  { label: "Events",            href: "#events" },
  { label: "Contact Us",        href: "#contact" },
];

function NavigationBar() {
  const [openIndex, setOpenIndex] = React.useState(null);
  const [mobileOpen, setMobileOpen] = React.useState(false);

  const closeAll = () => {
    setOpenIndex(null);
    setMobileOpen(false);
  };

  const toggleDropdown = (i) => {
    setOpenIndex(openIndex === i ? null : i);
  };

  return (
    <nav className="navbar" aria-label="Primary">
      <div className="navbar-inner">
        <a href="#home" className="navbar-brand" onClick={closeAll}>
          <span className="navbar-brand-mark"></span>
          Cyberfarms
        </a>

        <button
          className="navbar-toggle"
          aria-expanded={mobileOpen}
          aria-label="Toggle menu"
          onClick={() => setMobileOpen(!mobileOpen)}
        >
          {mobileOpen ? "Close" : "Menu"}
        </button>

        <ul className={mobileOpen ? "navbar-links open" : "navbar-links"}>
          {navItems.map((item, i) => {
            const hasSubmenu = Array.isArray(item.submenu);
            const isOpen = openIndex === i;

            return (
              <li
                key={item.label}
                className={
                  "navbar-item" +
                  (hasSubmenu ? " navbar-dropdown" : "") +
                  (isOpen ? " open" : "")
                }
              >
                {hasSubmenu ? (
                  <button
                    className="navbar-link"
                    aria-haspopup="true"
                    aria-expanded={isOpen}
                    onClick={() => toggleDropdown(i)}
                  >
                    {item.label}
                    <span className="navbar-caret" aria-hidden="true">▾</span>
                  </button>
                ) : (
                  <a href={item.href} className="navbar-link" onClick={closeAll}>
                    {item.label}
                  </a>
                )}

                {hasSubmenu && (
                  <ul className="navbar-submenu">
                    {item.submenu.map((sub) => (
                      <li key={sub.label}>
                        <a href={sub.href} onClick={closeAll}>
                          {sub.label}
                        </a>
                      </li>
                    ))}
                  </ul>
                )}
              </li>
            );
          })}
        </ul>
      </div>
    </nav>
  );
}

    function App() {
      const [siteData, setSiteData] = React.useState(() => window.CyberfarmsData.load());

      // Pick up edits made in admin.html if it's open in another tab of the same browser.
      React.useEffect(() => {
        const onStorage = (e) => {
          if (e.key === window.CyberfarmsData.STORAGE_KEY) {
            setSiteData(window.CyberfarmsData.load());
          }
        };
        window.addEventListener("storage", onStorage);
        return () => window.removeEventListener("storage", onStorage);
      }, []);

      return (
        <div>
            <NavigationBar />
            <Home heading={siteData.home.heading} body={siteData.home.body} />
            <AboutUs
              heading={siteData.about.heading}
              body={siteData.about.body}
              promoterDetails={siteData.about.promoters}
            />
            <Services categories={siteData.categories} />
            <Blogs />
            <FAQ />
            <Events />
            <ContactUs />
            <Footer />
        </div>
      );
    }

    // Find the mount point in the HTML above.
    const container = document.getElementById('root');

    // React 18 way: create a "root" and tell it what to render.
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

  </script>
